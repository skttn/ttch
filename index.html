<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tỉnh Thức Chuyển Hóa • Music Player</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' };</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, sans-serif; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.25); }
  .dark ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); }
  .dark ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }

  .bg-layer {
    position: fixed;
    inset: 0;
    z-index: -10;
    transition: opacity 900ms ease-in-out;
  }

  @keyframes coverFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .cover-fade-in {
    animation: coverFadeIn 350ms ease-out;
  }
  @keyframes coverFadeOut {
    from { opacity: 1; }
    to { opacity: 0; }
  }
  .cover-fade-out {
    animation: coverFadeOut 220ms ease-in forwards;
  }

  @keyframes textFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .text-fade-in {
    animation: textFadeIn 350ms ease-out;
  }
  @keyframes textFadeOut {
    from { opacity: 1; }
    to { opacity: 0; }
  }
  .text-fade-out {
    animation: textFadeOut 220ms ease-in forwards;
  }

  #progressTrack, #volumeTrack {
    cursor: pointer;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    height: 12px;
    width: 12px;
    border-radius: 999px;
    background: #ffffff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    margin-top: -4px;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 999px;
    background: rgba(0,0,0,0.15);
  }

  .song-row.active {
    background: rgba(255,255,255,0.55);
  }
  .dark .song-row.active {
    background: rgba(255,255,255,0.1);
  }

  @keyframes rowFadeToActive {
    from { background-color: rgba(255,255,255,0); }
    to { background-color: rgba(255,255,255,0.55); }
  }
  .row-fade-to-active {
    animation: rowFadeToActive 700ms ease-out forwards;
  }
  .dark .row-fade-to-active {
    animation: rowFadeToActiveDark 700ms ease-out forwards;
  }
  @keyframes rowFadeToActiveDark {
    from { background-color: rgba(255,255,255,0); }
    to { background-color: rgba(255,255,255,0.1); }
  }

  @keyframes rowFadeFromActive {
    from { background-color: rgba(255,255,255,0.55); }
    to { background-color: rgba(255,255,255,0); }
  }
  .row-fade-from-active {
    animation: rowFadeFromActive 700ms ease-out forwards;
  }
  .dark .row-fade-from-active {
    animation: rowFadeFromActiveDark 700ms ease-out forwards;
  }
  @keyframes rowFadeFromActiveDark {
    from { background-color: rgba(255,255,255,0.1); }
    to { background-color: rgba(255,255,255,0); }
  }

  .spin-slow {
    animation: spin 6s linear infinite;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .fade-in {
    animation: fadeIn 300ms ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Prevent the browser's native "drag image" ghost preview (the folded-corner
     thumbnail on Android/Chrome) and the iOS long-press callout menu, since we
     use pointerdown/long-press ourselves for the song-info popup. */
  img {
    -webkit-user-drag: none;
    user-drag: none;
    -webkit-touch-callout: none;
    user-select: none;
    -webkit-user-select: none;
  }  @keyframes toastIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes toastOut {
    from { opacity: 1; }
    to { opacity: 0; }
  }
  .toast-msg {
    animation: toastIn 200ms ease-out;
  }
  .toast-msg.toast-out {
    animation: toastOut 250ms ease-in forwards;
  }
</style>
</head>
<body class="h-screen overflow-hidden flex flex-col text-gray-800 dark:text-gray-100 transition-colors duration-700">

  <!-- Crossfade gradient background layers -->
  <div id="bgLayerA" class="bg-layer" style="opacity:1;"></div>
  <div id="bgLayerB" class="bg-layer" style="opacity:0;"></div>
  <div class="fixed inset-0 -z-[9] bg-white/40 dark:bg-black/60 transition-colors duration-700"></div>

  <!-- Header: floating search bar -->
  <header class="flex-shrink-0 px-4 pt-5 pb-3 md:px-8">
    <div class="max-w-3xl mx-auto">
      <div class="flex items-center justify-between mb-4">
        <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-gray-900 dark:text-gray-100">☀️ Tỉnh Thức Chuyển Hóa</h1>
        <div class="flex items-center gap-2">
          <button id="themeToggleBtn" title="Chuyển sáng/tối" class="p-2 rounded-full bg-white/50 dark:bg-white/10 backdrop-blur-md border border-white/60 dark:border-white/10 text-gray-600 dark:text-gray-300 hover:bg-white/70 dark:hover:bg-white/20 transition">
            <svg id="themeIconSun" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.36 6.36l-.7-.7M6.34 6.34l-.7-.7m12.02 0l-.7.7M6.34 17.66l-.7.7M12 7a5 5 0 100 10 5 5 0 000-10z" />
            </svg>
            <svg id="themeIconMoon" class="w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
            </svg>
          </button>
        </div>
      </div>
      <div class="relative">
        <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 104.5 4.5a7.5 7.5 0 0012.15 12.15z" />
        </svg>
        <input
          id="searchInput"
          type="text"
          placeholder="Tìm kiếm nội dung..."
          class="w-full pl-11 pr-4 py-3 rounded-2xl bg-white/50 dark:bg-white/10 backdrop-blur-xl border border-white/60 dark:border-white/10 shadow-lg shadow-black/5 focus:outline-none focus:ring-2 focus:ring-gray-400/60 placeholder-gray-500 dark:placeholder-gray-400 text-gray-800 dark:text-gray-100 transition"
        />
      </div>

      <!-- Playlist tabs -->
      <div id="playlistTabs" class="flex items-center gap-2 mt-4 overflow-x-auto pb-1"></div>
    </div>
  </header>

  <!-- Playlist (its own scroll region, bounded strictly below the header) -->
  <main class="flex-1 overflow-y-auto max-w-3xl w-full mx-auto px-4 md:px-8 pb-40 pt-2">
    <h2 id="playlistHeading" class="hidden text-sm font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-3 px-1">Danh sách phát</h2>
    <div id="playlist" class="flex flex-col gap-1.5"></div>
    <p id="emptyState" class="hidden text-center text-gray-400 dark:text-gray-500 py-10">Không tìm thấy bài hát nào phù hợp.</p>
  </main>

  <!-- Player bar (fixed bottom) -->
  <footer class="fixed bottom-0 left-0 right-0 z-30 px-3 pb-3 md:px-6 md:pb-5">
    <div class="max-w-3xl mx-auto bg-white/90 dark:bg-gray-900/90 border border-white/70 dark:border-white/10 rounded-3xl shadow-2xl shadow-black/10 px-4 py-3 md:px-6 md:py-4">

      <!-- Progress bar -->
      <div class="flex items-center gap-3 mb-2">
        <span id="currentTime" class="text-xs font-medium text-gray-500 dark:text-gray-300 w-10 text-right tabular-nums">00:00</span>
        <div id="progressTrack" class="relative flex-1 h-1.5 bg-black/10 dark:bg-white/10 rounded-full group">
          <div id="progressFill" class="absolute top-0 left-0 h-full bg-gray-800 dark:bg-gray-200 rounded-full" style="width:0%"></div>
          <div id="progressThumb" class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-3 h-3 bg-gray-900 dark:bg-white rounded-full opacity-0 group-hover:opacity-100 transition" style="left:0%"></div>
        </div>
        <span id="durationTime" class="text-xs font-medium text-gray-500 dark:text-gray-300 w-10 tabular-nums">00:00</span>
      </div>

      <div class="grid grid-cols-[1fr_auto_1fr] items-center gap-3">
        <!-- Sleep timer (left) -->
        <div class="flex items-center justify-self-start">
          <button id="sleepTimerBtn" title="Hẹn giờ tắt nhạc" class="relative p-2 rounded-full text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-100 hover:scale-105 active:scale-95 transition flex flex-col items-center justify-center">
            <svg class="w-6 h-6 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="13" r="8" stroke-linecap="round" stroke-linejoin="round" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4l3 2M9 2h6" />
            </svg>
            <span id="sleepTimerLabel" class="hidden text-[11px] font-semibold text-gray-900 dark:text-gray-100 tabular-nums whitespace-nowrap leading-none mt-1"></span>
          </button>
        </div>

        <!-- Playback controls (always centered) -->
        <div class="flex items-center gap-1 md:gap-3">
          <button id="repeatBtn" title="Lặp lại" class="relative p-2 rounded-full text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-100 hover:scale-105 active:scale-95 transition">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17 2l4 4-4 4M3 12v-2a4 4 0 014-4h14M7 22l-4-4 4-4M21 12v2a4 4 0 01-4 4H3" />
            </svg>
            <span id="repeatOneBadge" class="hidden absolute inset-0 items-center justify-center text-[11px] font-bold" style="transform: translateY(1px);">1</span>
          </button>

          <button id="prevBtn" title="Bài trước" class="p-2 rounded-full text-gray-700 dark:text-gray-300 hover:text-gray-900 dark:hover:text-gray-100 hover:scale-105 active:scale-95 transition">
            <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>

          <button id="playBtn" title="Phát/Tạm dừng" class="p-3.5 rounded-full bg-gray-900 text-white hover:scale-105 active:scale-95 transition shadow-lg">
            <svg id="playIcon" class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pauseIcon" class="w-6 h-6 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
          </button>

          <button id="nextBtn" title="Bài kế" class="p-2 rounded-full text-gray-700 dark:text-gray-300 hover:text-gray-900 dark:hover:text-gray-100 hover:scale-105 active:scale-95 transition">
            <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
          </button>

          <button id="orderBtn" title="Thứ tự phát" class="relative p-2 rounded-full text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-100 hover:scale-105 active:scale-95 transition">
            <svg id="orderIconSequential" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 8h16M14 3l5 5-5 5" />
              <path d="M2 16h16M14 11l5 5-5 5" />
            </svg>
            <svg id="orderIconShuffle" class="w-6 h-6 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="19" x2="19" y2="5" />
              <polyline points="12 5 19 5 19 12" />
              <line x1="5" y1="5" x2="19" y2="19" />
              <polyline points="19 12 19 19 12 19" />
            </svg>
          </button>
        </div>

        <!-- Volume + download (right) -->
        <div class="flex items-center gap-1 md:gap-3 justify-self-end">
          <div class="hidden md:flex items-center gap-2">
            <button id="muteBtn" title="Tắt/Bật tiếng" class="p-1 rounded-full text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-100 hover:scale-105 active:scale-95 transition">
              <svg id="volumeIconOn" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5zM19 12a4 4 0 00-2-3.46M22 12a7 7 0 00-3-5.75" />
              </svg>
              <svg id="volumeIconOff" class="w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5zM23 9l-6 6M17 9l6 6" />
              </svg>
            </button>
            <input id="volumeSlider" type="range" min="0" max="1" step="0.01" value="0.8" class="w-20" />
          </div>

          <button id="downloadBtn" title="Tải về" class="p-2 rounded-full text-gray-700 dark:text-gray-300 hover:text-gray-900 dark:hover:text-gray-100 hover:scale-105 active:scale-95 transition">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </footer>

  <div id="toastContainer" class="fixed left-1/2 -translate-x-1/2 z-50 pointer-events-none flex flex-col items-center" style="bottom: 100px;"></div>

  <audio id="audioPlayer" preload="auto"></audio>

  <!-- Song info overlay (opened via long-press/press-and-hold on a row) -->
  <div id="songInfoOverlay" class="hidden fixed inset-0 z-40 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-900 rounded-3xl shadow-2xl max-w-sm w-full p-5 relative">
      <button id="songInfoCloseBtn" title="Đóng" class="absolute top-3 right-3 p-1.5 rounded-full text-gray-500 dark:text-gray-400 hover:bg-black/5 dark:hover:bg-white/10 transition">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
      <img id="songInfoCover" src="" alt="" draggable="false" class="w-24 h-24 rounded-2xl object-cover shadow-md mx-auto mb-4" />
      <p id="songInfoTitle" class="text-center font-semibold text-lg text-gray-900 dark:text-gray-100 mb-1"></p>
      <p id="songInfoArtist" class="text-center text-sm text-gray-500 dark:text-gray-400 mb-3"></p>
      <div class="space-y-2 text-sm border-t border-black/5 dark:border-white/10 pt-3">
        <div class="flex justify-between gap-3"><span class="text-gray-500 dark:text-gray-400">Tác giả</span><span id="songInfoComposer" class="font-medium text-gray-800 dark:text-gray-200 text-right"></span></div>
        <div class="flex justify-between gap-3"><span class="text-gray-500 dark:text-gray-400">Thời lượng</span><span id="songInfoDuration" class="font-medium text-gray-800 dark:text-gray-200"></span></div>
      </div>
      <div id="songInfoTags" class="flex flex-wrap gap-1.5 mt-3"></div>
    </div>
  </div>

  <!-- Sleep timer overlay -->
  <div id="sleepTimerOverlay" class="hidden fixed inset-0 z-40 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-900 rounded-3xl shadow-2xl max-w-sm w-full p-5 relative">
      <button id="sleepTimerCloseBtn" title="Đóng" class="absolute top-3 right-3 p-1.5 rounded-full text-gray-500 dark:text-gray-400 hover:bg-black/5 dark:hover:bg-white/10 transition">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

      <p class="font-semibold text-lg text-gray-900 dark:text-gray-100 mb-1">Hẹn giờ tắt nhạc</p>
      <p id="sleepTimerStatus" class="text-sm text-gray-500 dark:text-gray-400 mb-4">Chưa bật hẹn giờ</p>

      <p class="text-xs font-semibold uppercase tracking-wide text-gray-400 dark:text-gray-500 mb-2">Theo thời gian</p>
      <div class="grid grid-cols-3 gap-2 mb-4">
        <button data-timer-minutes="15" class="sleep-timer-option py-2.5 rounded-xl text-sm font-medium bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/20 text-gray-800 dark:text-gray-100 transition">15 phút</button>
        <button data-timer-minutes="30" class="sleep-timer-option py-2.5 rounded-xl text-sm font-medium bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/20 text-gray-800 dark:text-gray-100 transition">30 phút</button>
        <button id="sleepTimerCustomMinutesBtn" class="sleep-timer-option py-2.5 rounded-xl text-sm font-medium bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/20 text-gray-800 dark:text-gray-100 transition">Tùy chọn</button>
      </div>

      <p class="text-xs font-semibold uppercase tracking-wide text-gray-400 dark:text-gray-500 mb-2">Theo số bài hát</p>
      <div class="grid grid-cols-4 gap-2 mb-4">
        <button data-timer-songs="3" class="sleep-timer-option py-2.5 rounded-xl text-sm font-medium bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/20 text-gray-800 dark:text-gray-100 transition">3 bài</button>
        <button data-timer-songs="5" class="sleep-timer-option py-2.5 rounded-xl text-sm font-medium bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/20 text-gray-800 dark:text-gray-100 transition">5 bài</button>
        <button data-timer-songs="7" class="sleep-timer-option py-2.5 rounded-xl text-sm font-medium bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/20 text-gray-800 dark:text-gray-100 transition">7 bài</button>
        <button id="sleepTimerCustomSongsBtn" class="sleep-timer-option py-2.5 rounded-xl text-sm font-medium bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/20 text-gray-800 dark:text-gray-100 transition">Tùy chọn</button>
      </div>

      <button id="sleepTimerCancelBtn" class="hidden w-full py-2.5 rounded-xl text-sm font-semibold text-gray-900 dark:text-gray-100 bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/20 transition">Tắt hẹn giờ</button>
    </div>
  </div>

  <!-- Small inline prompt for custom minutes/songs -->
  <div id="sleepTimerCustomOverlay" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-900 rounded-3xl shadow-2xl max-w-xs w-full p-5">
      <p id="sleepTimerCustomLabel" class="font-semibold text-gray-900 dark:text-gray-100 mb-3">Nhập số phút</p>
      <input id="sleepTimerCustomInput" type="number" min="1" class="w-full px-3 py-2.5 rounded-xl bg-black/5 dark:bg-white/10 text-gray-900 dark:text-gray-100 mb-4 outline-none focus:ring-2 focus:ring-gray-400/60" />
      <div class="flex gap-2">
        <button id="sleepTimerCustomCancel" class="flex-1 py-2.5 rounded-xl text-sm font-medium bg-black/5 dark:bg-white/10 text-gray-800 dark:text-gray-100 transition">Hủy</button>
        <button id="sleepTimerCustomConfirm" class="flex-1 py-2.5 rounded-xl text-sm font-semibold text-white bg-gray-900 dark:bg-white dark:text-gray-900 transition">Xác nhận</button>
      </div>
    </div>
  </div>

<script>
  const R2_BASE = "https://pub-efdb0d7dd4894c93ba0a9425a5c25bdf.r2.dev/";
  const ALL_TAG = "Tất cả";

  // Real Unsplash nature photos (no people), cycled across the playlist
  const NATURE_COVERS = [
    "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=300&h=300&fit=crop&auto=format&q=80", // núi non lúc hoàng hôn
    "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=300&h=300&fit=crop&auto=format&q=80", // sương sớm trên đỉnh núi
    "https://images.unsplash.com/photo-1454496522488-7a8e488e8606?w=300&h=300&fit=crop&auto=format&q=80", // núi tuyết soi bóng mặt hồ
    "https://images.unsplash.com/photo-1433086966358-54859d0ed716?w=300&h=300&fit=crop&auto=format&q=80", // thác nước giữa rừng
    "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=300&h=300&fit=crop&auto=format&q=80", // nắng xuyên qua rừng thông

  function parseSongMeta(file) {
    const m = file.match(/^(?:🎵\s*)?(.+?)\s*\((.+)\)\s*[.•]\s*(.+?)\s*\(TTCH\s*-\s*Số\s*(\d+)\)\.mp3$/iu);
    if (!m) return { title: file.replace(/\.mp3$/i, "").replace(/^🎵\s*/, ""), artist: "TTCH", composer: "" };
    // the composer/origin note is the last " - " segment inside the first parenthesis, e.g. "... - Nhạc ngoại";
    // everything before that is the original song name this TTCH version is set to
    const subtitleParts = m[2].split(" - ");
    const composer = subtitleParts[subtitleParts.length - 1].replace(/\s+/g, " ").trim();
    const originalTitle = subtitleParts.slice(0, -1).join(" - ").replace(/\s+/g, " ").trim();
    const shortTitle = m[1].replace(/\s+/g, " ").trim();
    return {
      title: originalTitle ? `${shortTitle} (${originalTitle})` : shortTitle,
      artist: m[3].replace(/\s+/g, " ").trim(),
      composer,
    };
  }

  const allSongs = songFiles.map((entry, idx) => {

    return {

      file: entry.file,
      tags: entry.tags,
      title: meta.title,
      artist: meta.artist,
      composer: meta.composer,
      src: R2_BASE + encodeURIComponent(entry.file),
      gradient: GRADIENTS[idx % GRADIENTS.length],
      duration: null,
      durationLoading: false,
      cover: natureCover(idx),
    };
  });

  const allTags = [ALL_TAG, ...Array.from(new Set(allSongs.flatMap((s) => s.tags))).sort((a, b) => a.localeCompare(b, "vi"))];

  // ---- Helpers ----
  function formatTime(seconds) {
    if (!isFinite(seconds) || seconds === null || isNaN(seconds)) return "00:00";
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  }

  function gradientCss([c1, c2]) {
    return `radial-gradient(circle at center, ${c1}, ${c2})`;
  }

  function crossfadeBackground(gradient) {
    const showLayer = activeBgLayer === "A" ? bgLayerB : bgLayerA;
    const hideLayer = activeBgLayer === "A" ? bgLayerA : bgLayerB;
    showLayer.style.background = gradientCss(gradient);
    showLayer.style.opacity = "1";
    hideLayer.style.opacity = "0";
    activeBgLayer = activeBgLayer === "A" ? "B" : "A";
  }

  // Swaps the player's cover art by inserting a brand-new <img> (with a
  // fade-in animation) instead of mutating the existing element's src/opacity
  // in place — same safe pattern used for the playlist rows, avoids the
  // Android paint-artifact issue we ran into earlier.
  // Guards against rapid successive song switches: each call cancels any
  // fade still pending from a previous call on the same element, so if the
  // user taps through several songs faster than the 220ms fade-out, only the
  // very last one ever actually inserts its content — no flashing through
  // mismatched intermediate title/artist/cover combinations anymore.

  function ensureDurationLoaded(song) {
    if (song.duration || song.durationLoading) return;
    song.durationLoading = true;
    const probe = new Audio();
    probe.preload = "metadata";
    probe.src = song.src;
    probe.addEventListener("loadedmetadata", () => {
      song.duration = probe.duration;
      song.durationLoading = false;
      updateDurationBadge(song.id);
    });
  }

  // ---- Rendering tag tabs ----
  function renderTabs() {
    playlistTabsEl.innerHTML = "";
    allTags.forEach((tag) => {
      const tab = document.createElement("button");
      const isActive = tag === currentTag;
      const songCount = tag === ALL_TAG ? allSongs.length : allSongs.filter((song) => song.tags.includes(tag)).length;
      tab.setAttribute("aria-label", `${tag}: ${songCount} bài hát`);
      tab.className = `flex-shrink-0 flex items-center gap-2 px-5 py-2.5 rounded-full text-base font-medium border transition ${
        isActive
          ? "bg-gray-900 dark:bg-white text-white dark:text-gray-900 border-gray-900 dark:border-white shadow-md"
          : "bg-white/50 dark:bg-white/10 text-gray-600 dark:text-gray-300 border-white/60 dark:border-white/10 hover:bg-white/70 dark:hover:bg-white/20"
      }`;
      tab.innerHTML = `<span>${TAG_ICONS[tag] || "🏷️"}</span><span>${tag}</span><span class="text-xs tabular-nums rounded-full bg-black/10 dark:bg-white/10 px-2 py-0.5">${songCount}</span>`;
      tab.addEventListener("click", () => {
        currentTag = tag;
        searchInput.value = "";
        applyFilter();
        renderTabs();
      });
      playlistTabsEl.appendChild(tab);
    });
  }

  // ---- Rendering playlist ----
  function applyFilter() {
    const q = searchInput.value.trim().toLowerCase();
    isSearching = q.length > 0;

    if (isSearching) {
      // search across every tag, not just the active one
      filteredSongs = allSongs.filter((s) => s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q));
      playlistHeading.textContent = `Kết quả tìm kiếm cho "${searchInput.value.trim()}" (${filteredSongs.length} bài hát)`;
      playlistHeading.classList.remove("hidden");
    } else if (currentTag === ALL_TAG) {
      filteredSongs = allSongs.slice();
      playlistHeading.classList.add("hidden");
    } else {
      filteredSongs = allSongs.filter((s) => s.tags.includes(currentTag));
      playlistHeading.classList.add("hidden");
    }
    renderPlaylist();
  }

  let lastRenderedIds = null;

  function buildRow(song, index, transitionClass) {
    const isCurrent = song.id === currentSongId;
    const row = document.createElement("div");
    row.dataset.songId = song.id;
    row.className = `song-row flex items-center gap-3 px-3 py-2.5 rounded-2xl cursor-pointer hover:bg-white/40 dark:hover:bg-white/10 ${isCurrent ? "active" : ""} ${transitionClass || ""}`;

    row.innerHTML = `
      <span class="song-number w-7 md:w-9 flex-shrink-0 text-right text-sm text-gray-500 dark:text-gray-400 tabular-nums" aria-label="Số thứ tự ${index + 1}">${index + 1}</span>
      <div class="relative flex-shrink-0">
        <img src="${song.cover}" alt="${song.title}" draggable="false" class="w-14 h-14 rounded-lg object-cover shadow-sm" />
        <div class="row-playing-overlay absolute inset-0 bg-black/30 rounded-lg flex items-center justify-center ${isCurrent && isPlaying ? "opacity-100" : "opacity-0 pointer-events-none"}">
          <div class="flex items-end gap-0.5 h-3.5">
            <span class="w-0.5 bg-white animate-pulse" style="height:60%"></span>
            <span class="w-0.5 bg-white animate-pulse" style="height:100%; animation-delay:150ms"></span>
            <span class="w-0.5 bg-white animate-pulse" style="height:40%; animation-delay:300ms"></span>
          </div>
        </div>
      </div>
      <div class="min-w-0 flex-1">
        <p class="font-medium text-gray-900 dark:text-gray-100 line-clamp-2 text-base md:text-lg" title="${song.title}">${song.title}</p>
        <p class="text-sm md:text-base text-gray-500 dark:text-gray-400 truncate">${song.artist}</p>
        ${song.composer ? `<p class="md:hidden text-xs text-gray-500 dark:text-gray-400 truncate">Tác giả: ${song.composer}</p>` : ""}
        <div class="flex flex-wrap gap-1 mt-1">
          ${song.tags.map((t) => `<span class="text-[10px] font-medium text-gray-500 dark:text-gray-400 bg-black/5 dark:bg-white/10 px-2 py-0.5 rounded-full">${t}</span>`).join("")}
        </div>
      </div>
      ${song.composer ? `<div class="hidden md:block w-28 lg:w-36 flex-shrink-0">
        <p class="text-[11px] uppercase tracking-wide text-gray-500 dark:text-gray-400">Tác giả</p>
        <p class="text-sm text-gray-500 dark:text-gray-400 truncate">${song.composer}</p>
      </div>` : ""}
      <span class="text-sm font-medium text-gray-500 dark:text-gray-400 tabular-nums flex-shrink-0" data-duration-for="${song.id}">
        ${song.duration ? formatTime(song.duration) : "--:--"}
      </span>
      <button title="Tải về" class="row-download-btn flex-shrink-0 p-1.5 rounded-full text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-100 hover:bg-black/5 dark:hover:bg-white/10 transition">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" />
        </svg>
      </button>
    `;

    let longPressTimer = null;
    let longPressTriggered = false;

    row.addEventListener("pointerdown", () => {
      longPressTriggered = false;
      longPressTimer = setTimeout(() => {
        longPressTriggered = true;
        showSongInfo(song);
      }, 550);
    });
    const cancelLongPress = () => clearTimeout(longPressTimer);
    row.addEventListener("pointerup", cancelLongPress);
    row.addEventListener("pointerleave", cancelLongPress);
    row.addEventListener("pointercancel", cancelLongPress);
    row.addEventListener("contextmenu", (e) => e.preventDefault());

    row.addEventListener("click", () => {
      if (longPressTriggered) { longPressTriggered = false; return; }
      loadSong(song, true, filteredSongs);
    });

    row.querySelector(".row-download-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      downloadSong(song);
    });

    return row;
  }

  function renderPlaylist() {
    const idsKey = filteredSongs.map((s) => s.id).join(",");

    // If the same set/order of songs is already on screen, don't rebuild the
    // whole list (that caused the whole playlist to flash on every tap).
    // Just swap out the specific row(s) whose state actually changed.
    if (idsKey === lastRenderedIds) {
      updateRowStates();
      return;
    }
    lastRenderedIds = idsKey;

    playlistEl.innerHTML = "";
    emptyState.classList.toggle("hidden", filteredSongs.length > 0);

    filteredSongs.forEach((song, index) => {
      playlistEl.appendChild(buildRow(song, index));
      ensureDurationLoaded(song);
    });
  }

  // Only the row(s) whose active/playing state actually changed get replaced
  // with a freshly built element (not just class-toggled in place). On
  // Android, mutating classes/opacity on an already-painted rounded element
  // can leave a torn-corner paint artifact; swapping in a brand-new element
  // avoids that, while leaving every other (untouched) row's DOM completely
  // alone avoids any full-list flash.
  function updateRowStates() {
    playlistEl.querySelectorAll(".song-row").forEach((row) => {
      const id = Number(row.dataset.songId);
      const isCurrent = id === currentSongId;
      const overlay = row.querySelector(".row-playing-overlay");
      const showOverlay = isCurrent && isPlaying;
      const overlayIsShown = overlay && overlay.classList.contains("opacity-100");
      const rowIsActive = row.classList.contains("active");

      if (rowIsActive === isCurrent && overlayIsShown === showOverlay) return;

      const index = filteredSongs.findIndex((s) => s.id === id);
      const song = filteredSongs[index];
      if (!song) return;

      let transitionClass = "";
      if (!rowIsActive && isCurrent) transitionClass = "row-fade-to-active";
      else if (rowIsActive && !isCurrent) transitionClass = "row-fade-from-active";

      row.replaceWith(buildRow(song, index, transitionClass));
    });
  }

  function updateDurationBadge(songId) {
    const el = playlistEl.querySelector(`[data-duration-for="${songId}"]`);
    const song = allSongs.find((s) => s.id === songId);
    if (el && song) el.textContent = formatTime(song.duration);
  }

  // ---- Song info modal (long-press) ----
  function showSongInfo(song) {
    songInfoCover.src = song.cover;
    songInfoTitle.textContent = song.title;
    songInfoArtist.textContent = song.artist;
    songInfoComposer.textContent = song.composer || "—";
    songInfoDuration.textContent = song.duration ? formatTime(song.duration) : "--:--";
    songInfoTags.innerHTML = song.tags
      .map((t) => `<span class="text-xs font-medium text-gray-500 dark:text-gray-400 bg-black/5 dark:bg-white/10 px-2 py-1 rounded-full">${t}</span>`)
      .join("");
    songInfoOverlay.classList.remove("hidden");
  }

  function hideSongInfo() {
    songInfoOverlay.classList.add("hidden");
  }

  songInfoCloseBtn.addEventListener("click", hideSongInfo);
  songInfoOverlay.addEventListener("click", (e) => {
    if (e.target === songInfoOverlay) hideSongInfo();
  });

  // ---- Sleep timer ----
  function openSleepTimerMenu() {
    sleepTimerStatus.textContent = sleepTimerStatusText();
    sleepTimerCancelBtn.classList.toggle("hidden", sleepTimerMode === "none");
    sleepTimerOverlay.classList.remove("hidden");
  }

  function closeSleepTimerMenu() {
    sleepTimerOverlay.classList.add("hidden");
  }

  function sleepTimerStatusText() {
    if (sleepTimerMode === "time" && sleepTimerDeadline) {
      const remainMs = Math.max(0, sleepTimerDeadline - Date.now());
      return `Sẽ tắt nhạc sau ${formatTime(Math.ceil(remainMs / 1000))}`;
    }
    if (sleepTimerMode === "songs") {
      return `Sẽ tắt nhạc sau ${sleepTimerSongsLeft} bài nữa`;
    }
    return "Chưa bật hẹn giờ";
  }

  function refreshSleepTimerLabel() {
    if (sleepTimerMode === "time" && sleepTimerDeadline) {
      const remainMs = Math.max(0, sleepTimerDeadline - Date.now());
      sleepTimerLabel.textContent = formatTime(Math.ceil(remainMs / 1000));
      sleepTimerLabel.classList.remove("hidden");
    } else if (sleepTimerMode === "songs") {
      sleepTimerLabel.textContent = `${sleepTimerSongsLeft} bài`;
      sleepTimerLabel.classList.remove("hidden");
    } else {
      sleepTimerLabel.classList.add("hidden");
    }
    sleepTimerBtn.classList.toggle("!text-gray-900", sleepTimerMode !== "none");
    sleepTimerBtn.classList.toggle("dark:!text-gray-100", sleepTimerMode !== "none");
    if (!sleepTimerOverlay.classList.contains("hidden")) {
      sleepTimerStatus.textContent = sleepTimerStatusText();
      sleepTimerCancelBtn.classList.toggle("hidden", sleepTimerMode === "none");
    }
  }

  function stopSleepTimerTick() {
    clearInterval(sleepTimerTickInterval);
    sleepTimerTickInterval = null;
  }

  function triggerSleepTimer() {
    audio.pause();
    isPlaying = false;
    updatePlayIcon();
    renderPlaylist();
    clearSleepTimer();
    showToast("Đã tắt nhạc theo hẹn giờ");
  }

  function clearSleepTimer() {
    sleepTimerMode = "none";
    sleepTimerDeadline = null;
    sleepTimerSongsLeft = 0;
    stopSleepTimerTick();
    refreshSleepTimerLabel();
  }

  function setSleepTimerMinutes(minutes) {
    if (!minutes || minutes <= 0) return;
    sleepTimerMode = "time";
    sleepTimerDeadline = Date.now() + minutes * 60 * 1000;
    sleepTimerSongsLeft = 0;
    stopSleepTimerTick();
    sleepTimerTickInterval = setInterval(() => {
      if (Date.now() >= sleepTimerDeadline) { triggerSleepTimer(); return; }
      refreshSleepTimerLabel();
    }, 1000);
    refreshSleepTimerLabel();
    showToast(`Đã hẹn giờ tắt nhạc sau ${minutes} phút`);
    closeSleepTimerMenu();
  }

  function setSleepTimerSongs(count) {
    if (!count || count <= 0) return;
    sleepTimerMode = "songs";
    sleepTimerSongsLeft = count;
    sleepTimerDeadline = null;
    stopSleepTimerTick();
    refreshSleepTimerLabel();
    showToast(`Đã hẹn giờ tắt nhạc sau ${count} bài`);
    closeSleepTimerMenu();
  }

  // Called once per completed song (from the "ended" handler). Returns true
  // if playback should stop right here (timer just fired).
  function noteSongFinishedForSleepTimer() {
    if (sleepTimerMode !== "songs") return false;
    sleepTimerSongsLeft -= 1;
    if (sleepTimerSongsLeft <= 0) {
      triggerSleepTimer();
      return true;
    }
    refreshSleepTimerLabel();
    return false;
  }

  function openCustomSleepPrompt(kind) {
    sleepTimerPendingKind = kind;
    sleepTimerCustomLabel.textContent = kind === "minutes" ? "Nhập số phút" : "Nhập số bài hát";
    sleepTimerCustomInput.value = "";
    sleepTimerCustomOverlay.classList.remove("hidden");
    setTimeout(() => sleepTimerCustomInput.focus(), 50);
  }

  function closeCustomSleepPrompt() {
    sleepTimerCustomOverlay.classList.add("hidden");
    sleepTimerPendingKind = null;
  }

  sleepTimerBtn.addEventListener("click", openSleepTimerMenu);
  sleepTimerCloseBtn.addEventListener("click", closeSleepTimerMenu);
  sleepTimerOverlay.addEventListener("click", (e) => {
    if (e.target === sleepTimerOverlay) closeSleepTimerMenu();
  });

  document.querySelectorAll(".sleep-timer-option[data-timer-minutes]").forEach((btn) => {
    btn.addEventListener("click", () => setSleepTimerMinutes(Number(btn.dataset.timerMinutes)));
  });
  document.querySelectorAll(".sleep-timer-option[data-timer-songs]").forEach((btn) => {
    btn.addEventListener("click", () => setSleepTimerSongs(Number(btn.dataset.timerSongs)));
  });

  sleepTimerCustomMinutesBtn.addEventListener("click", () => openCustomSleepPrompt("minutes"));
  sleepTimerCustomSongsBtn.addEventListener("click", () => openCustomSleepPrompt("songs"));
  sleepTimerCancelBtn.addEventListener("click", () => { clearSleepTimer(); showToast("Đã tắt hẹn giờ"); closeSleepTimerMenu(); });

  sleepTimerCustomCancel.addEventListener("click", closeCustomSleepPrompt);
  sleepTimerCustomOverlay.addEventListener("click", (e) => {
    if (e.target === sleepTimerCustomOverlay) closeCustomSleepPrompt();
  });
  sleepTimerCustomConfirm.addEventListener("click", () => {
    const value = Number(sleepTimerCustomInput.value);
    if (!value || value <= 0) return;
    if (sleepTimerPendingKind === "minutes") setSleepTimerMinutes(value);
    else if (sleepTimerPendingKind === "songs") setSleepTimerSongs(value);
    closeCustomSleepPrompt();
  });
  sleepTimerCustomInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sleepTimerCustomConfirm.click();
  });

  // ---- Player logic ----
  let playRequestId = 0;
  // Start as soon as the browser has enough data to play. Waiting for a large
  // buffer here makes the button feel unresponsive on slower connections.
  // The waiting/stalled handlers below recover automatically if the network
  // cannot keep up during playback.
  const INITIAL_BUFFER_SECONDS = 0;

  function getBufferedSeconds() {
    if (!audio.buffered.length) return 0;
    for (let i = 0; i < audio.buffered.length; i++) {
      if (audio.currentTime >= audio.buffered.start(i) && audio.currentTime <= audio.buffered.end(i)) {
        return Math.max(0, audio.buffered.end(i) - audio.currentTime);
      }
    }
    return 0;
  }

  function playCurrentAudio() {
    const requestId = ++playRequestId;

    return new Promise((resolve, reject) => {
      const rejectOnError = () => {
        cleanup();
        reject(new Error("Không thể tải file nhạc"));
      };
      let bufferTimeout;
      const tryPlay = (ignoreBuffer = false) => {
        if (requestId !== playRequestId) {
          cleanup();
          reject(new Error("Yêu cầu phát đã bị thay thế"));
          return;
        }
        const hasEnoughBuffer = getBufferedSeconds() >= INITIAL_BUFFER_SECONDS ||
          (audio.duration && audio.duration - audio.currentTime <= INITIAL_BUFFER_SECONDS);
        if (!hasEnoughBuffer && !ignoreBuffer) return;

        audio.play().then(() => {
          cleanup();
          resolve();
        }).catch((error) => {
          cleanup();
          reject(error);
        });
      };
      const cleanup = () => {
        clearTimeout(bufferTimeout);
        audio.removeEventListener("canplay", tryPlay);
        audio.removeEventListener("progress", tryPlay);
        audio.removeEventListener("loadeddata", tryPlay);
        audio.removeEventListener("error", rejectOnError);
      };

      audio.addEventListener("canplay", tryPlay);
      audio.addEventListener("progress", tryPlay);
      audio.addEventListener("loadeddata", tryPlay);
      audio.addEventListener("error", rejectOnError, { once: true });
      bufferTimeout = setTimeout(() => tryPlay(true), 15000);

      if (audio.readyState >= HTMLMediaElement.HAVE_FUTURE_DATA) {
        tryPlay();
      } else {
        audio.load();
      }
    });
  }

  function loadSong(song, autoplay, queue) {
    currentSongId = song.id;
    currentQueue = queue && queue.length ? queue : filteredSongs;
    currentQueuePos = currentQueue.findIndex((s) => s.id === song.id);
    if (currentQueuePos === -1) currentQueuePos = 0;

    const targetVolume = parseFloat(volumeSlider.value);
    const wasPlaying = !audio.paused && !audio.ended;

    const startNewSong = () => {
      audio.src = song.src;
      audio.volume = 0;

      crossfadeBackground(song.gradient);
      renderPlaylist();
      updateMediaSessionMetadata(song);

      if (autoplay) {
        playCurrentAudio().then(() => {
          isPlaying = true;
          updatePlayIcon();
          renderPlaylist();
          fadeVolume(audio, targetVolume, 700);
        }).catch(() => {
          isPlaying = false;
          updatePlayIcon();
          renderPlaylist();
          showToast("Chưa tải được bài hát, hãy thử lại");
        });
      } else {
        audio.volume = targetVolume;
        audio.load();
      }
    };

    // Fade the current song's volume out first (if something is playing),
    // then switch tracks and fade the new one in — avoids an abrupt cut.
    if (wasPlaying) {
      fadeVolume(audio, 0, 450, startNewSong);
    } else {
      startNewSong();
    }
  }

  // Smoothly ramps an <audio> element's volume to `target` over `duration`ms.
  // Skips straight to the target when the page is backgrounded (screen off /
  // switched app): background tabs get their JS timers throttled hard by the
  // browser, so a step-based fade can get stuck barely above 0 for a long
  // time — sounding like "no audio" even though the track is actually
  // playing behind the scenes.
  let volumeFadeTimer = null;
  function fadeVolume(audioEl, target, duration, onDone) {
    clearInterval(volumeFadeTimer);
    if (document.hidden) {
      audioEl.volume = target;
      if (onDone) onDone();
      return;
    }
    const start = audioEl.volume;
    const diff = target - start;
    if (Math.abs(diff) < 0.01 || duration <= 0) {
      audioEl.volume = target;
      if (onDone) onDone();
      return;
    }
    const stepMs = 30;
    const steps = Math.max(1, Math.round(duration / stepMs));
    let i = 0;
    volumeFadeTimer = setInterval(() => {
      // If the page gets backgrounded mid-fade, jump straight to the target
      // instead of continuing a fade that background throttling would stall.
      if (document.hidden) {
        clearInterval(volumeFadeTimer);
        audioEl.volume = target;
        if (onDone) onDone();
        return;
      }
      i++;
      audioEl.volume = Math.min(1, Math.max(0, start + (diff * i) / steps));
      if (i >= steps) {
        clearInterval(volumeFadeTimer);
        audioEl.volume = target;
        if (onDone) onDone();
      }
    }, stepMs);
  }

  // ---- Media Session (lock screen / notification controls, background playback) ----
  function updateMediaSessionMetadata(song) {
    if (!("mediaSession" in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: song.title,
      artist: song.artist,
      album: song.tags.join(", "),
      artwork: [{ src: song.cover, sizes: "512x512", type: "image/jpeg" }],
    });
  }

  function initMediaSession() {
    if (!("mediaSession" in navigator)) return;
    navigator.mediaSession.setActionHandler("play", () => togglePlay());
    navigator.mediaSession.setActionHandler("pause", () => togglePlay());
    navigator.mediaSession.setActionHandler("previoustrack", () => prevSong());
    navigator.mediaSession.setActionHandler("nexttrack", () => nextSong());
    navigator.mediaSession.setActionHandler("seekto", (details) => {
      if (details.seekTime != null) audio.currentTime = details.seekTime;
    });
  }

  function updatePlayIcon() {
    playIcon.classList.toggle("hidden", isPlaying);
    pauseIcon.classList.toggle("hidden", !isPlaying);
  }

  function togglePlay() {
    if (!audio.src) {
      if (filteredSongs.length) loadSong(filteredSongs[0], true, filteredSongs);
      return;
    }
    if (isPlaying) {
      audio.pause();
      isPlaying = false;
      updatePlayIcon();
      renderPlaylist();
    } else {
      playCurrentAudio().then(() => {
        isPlaying = true;
        updatePlayIcon();
        renderPlaylist();
        if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing";
      }).catch(() => {
        isPlaying = false;
        updatePlayIcon();
        renderPlaylist();
        showToast("Chưa tải được bài hát, hãy thử lại");
      });
    }
    if ("mediaSession" in navigator && !isPlaying) navigator.mediaSession.playbackState = "paused";
  }

  function nextSong() {
    if (!currentQueue.length) return;

    if (playOrderMode === "shuffle" && currentQueue.length > 1) {
      shuffleHistory.push(currentQueue[currentQueuePos].id);
      let randomPos;
      do { randomPos = Math.floor(Math.random() * currentQueue.length); } while (randomPos === currentQueuePos);
      loadSong(currentQueue[randomPos], isPlaying, currentQueue);
      return;
    }

    const nextPos = (currentQueuePos + 1) % currentQueue.length;
    loadSong(currentQueue[nextPos], isPlaying, currentQueue);
  }

  function prevSong() {
    if (audio.currentTime > 3) {
      audio.currentTime = 0;
      return;
    }
    if (!currentQueue.length) return;

    if (playOrderMode === "shuffle" && shuffleHistory.length) {
      const prevId = shuffleHistory.pop();
      const song = currentQueue.find((s) => s.id === prevId) || allSongs.find((s) => s.id === prevId);
      if (song) { loadSong(song, isPlaying, currentQueue); return; }
    }

    const prevPos = (currentQueuePos - 1 + currentQueue.length) % currentQueue.length;
    loadSong(currentQueue[prevPos], isPlaying, currentQueue);
  }

  function showToast(message) {
    const toast = document.createElement("div");
    toast.className = "toast-msg bg-gray-900/90 dark:bg-gray-100/90 text-white dark:text-gray-900 text-sm font-medium px-4 py-2 rounded-full shadow-lg whitespace-nowrap";
    toast.textContent = message;
    toastContainer.appendChild(toast);
    setTimeout(() => {
      toast.classList.add("toast-out");
      setTimeout(() => toast.remove(), 260);
    }, 1800);
  }

  function cycleRepeat() {
    repeatMode = repeatMode === "none" ? "all" : repeatMode === "all" ? "one" : "none";
    repeatBtn.classList.toggle("!text-gray-900", repeatMode !== "none");
    repeatBtn.classList.toggle("dark:!text-gray-100", repeatMode !== "none");
    repeatOneBadge.classList.toggle("hidden", repeatMode !== "one");
    repeatOneBadge.classList.toggle("flex", repeatMode === "one");

    if (repeatMode === "all") showToast("Đã bật chế độ Lặp lại danh sách");
    else if (repeatMode === "one") showToast("Đã bật chế độ Lặp lại một bài");
    else showToast("Đã tắt chế độ Lặp lại");
  }

  function cyclePlayOrder() {
    playOrderMode = playOrderMode === "off" ? "sequential" : playOrderMode === "sequential" ? "shuffle" : "off";
    if (playOrderMode !== "shuffle") shuffleHistory = [];

    const isOn = playOrderMode !== "off";
    orderBtn.classList.toggle("!text-gray-900", isOn);
    orderBtn.classList.toggle("dark:!text-gray-100", isOn);
    orderIconShuffle.classList.toggle("hidden", playOrderMode !== "shuffle");
    orderIconSequential.classList.toggle("hidden", playOrderMode === "shuffle");

    if (playOrderMode === "sequential") showToast("Đã bật chế độ Phát theo thứ tự");
    else if (playOrderMode === "shuffle") showToast("Đã bật chế độ Phát ngẫu nhiên");
    else showToast("Đã tắt chế độ Phát ngẫu nhiên");
  }

  async function downloadSong(song) {
    const filename = `${song.title} - ${song.artist}.mp3`;
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    // mobile browsers (esp. iOS Safari) largely ignore the `download` attribute on blob URLs,
    // so just open the file directly and let the OS media UI offer its own save/share option
    if (isMobile) {
      window.open(song.src, "_blank", "noopener");
      return;
    }

    try {
      // same-origin (or CORS-enabled) files can be downloaded as a blob with the real filename
      const response = await fetch(song.src);
      if (!response.ok) throw new Error(`Fetch failed: ${response.status}`);
      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      // delay revoke so the browser has time to actually start the download
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch (err) {
      // cross-origin sources without CORS block blob fetch, fall back to a direct link
      const link = document.createElement("a");
      link.href = song.src;
      link.download = filename;
      link.target = "_blank";
      link.rel = "noopener";
      document.body.appendChild(link);
      link.click();
      link.remove();
    }
  }

  function downloadCurrentSong() {
    const song = allSongs.find((s) => s.id === currentSongId);
    if (song) downloadSong(song);
  }

  // ---- Progress bar ----
  audio.addEventListener("timeupdate", () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    progressFill.style.width = `${pct}%`;
    progressThumb.style.left = `${pct}%`;
    currentTimeEl.textContent = formatTime(audio.currentTime);
  });

  audio.addEventListener("loadedmetadata", () => {
    durationTimeEl.textContent = formatTime(audio.duration);
  });

  // A remote file can temporarily outrun its network buffer after playback
  // starts. Keep the player in the playing state and resume automatically when
  // more data arrives instead of requiring the user to press Play again.
  audio.addEventListener("waiting", () => {
    if (isPlaying) audio.play().catch(() => {});
  });
  audio.addEventListener("stalled", () => {
    if (isPlaying) audio.play().catch(() => {});
  });

  // Safety net: if we come back from the background and the volume somehow
  // got left lower than it should be (e.g. a fade was interrupted by
  // throttling at an awkward moment), snap it back to the correct level.
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && isPlaying) {
      const targetVolume = parseFloat(volumeSlider.value);
      if (Math.abs(audio.volume - targetVolume) > 0.02) {
        audio.volume = targetVolume;
      }
    }
  });

  audio.addEventListener("ended", () => {
    if (noteSongFinishedForSleepTimer()) return;

    if (repeatMode === "one") {
      audio.currentTime = 0;
      audio.play();
    } else if (repeatMode === "all" || currentQueuePos < currentQueue.length - 1) {
      nextSong();
    } else {
      isPlaying = false;
      updatePlayIcon();
      renderPlaylist();
    }
  });

  progressTrack.addEventListener("click", (e) => {
    if (!audio.duration) return;
    const rect = progressTrack.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    audio.currentTime = pct * audio.duration;
  });

  // drag-to-seek: update progress bar while dragging, only commit audio.currentTime on release
  let isDraggingProgress = false;

  function seekFromClientX(clientX) {
    const rect = progressTrack.getBoundingClientRect();
    const pct = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    progressFill.style.width = `${pct * 100}%`;
    progressThumb.style.left = `${pct * 100}%`;
    currentTimeEl.textContent = formatTime(pct * (audio.duration || 0));
    return pct;
  }

  progressTrack.addEventListener("mousedown", (e) => {
    if (!audio.duration) return;
    isDraggingProgress = true;
    seekFromClientX(e.clientX);
  });

  progressTrack.addEventListener("touchstart", (e) => {
    if (!audio.duration) return;
    isDraggingProgress = true;
    seekFromClientX(e.touches[0].clientX);
  }, { passive: true });

  window.addEventListener("mousemove", (e) => {
    if (!isDraggingProgress) return;
    seekFromClientX(e.clientX);
  });

  window.addEventListener("touchmove", (e) => {
    if (!isDraggingProgress) return;
    seekFromClientX(e.touches[0].clientX);
  }, { passive: true });

  function endProgressDrag(clientX) {
    if (!isDraggingProgress) return;
    isDraggingProgress = false;
    if (audio.duration) audio.currentTime = seekFromClientX(clientX) * audio.duration;
  }

  window.addEventListener("mouseup", (e) => endProgressDrag(e.clientX));
  window.addEventListener("touchend", (e) => endProgressDrag(e.changedTouches[0].clientX));

  // ---- Volume ----
  let volumeBeforeMute = parseFloat(volumeSlider.value);

  function updateVolumeIcon() {
    const muted = audio.volume === 0;
    volumeIconOn.classList.toggle("hidden", muted);
    volumeIconOff.classList.toggle("hidden", !muted);
  }

  volumeSlider.addEventListener("input", (e) => {
    audio.volume = parseFloat(e.target.value);
    if (audio.volume > 0) volumeBeforeMute = audio.volume;
    updateVolumeIcon();
  });
  audio.volume = parseFloat(volumeSlider.value);
  updateVolumeIcon();

  muteBtn.addEventListener("click", () => {
    if (audio.volume > 0) {
      volumeBeforeMute = audio.volume;
      audio.volume = 0;
      volumeSlider.value = 0;
    } else {
      audio.volume = volumeBeforeMute || 0.8;
      volumeSlider.value = audio.volume;
    }
    updateVolumeIcon();
  });

  // ---- Search filter ----
  searchInput.addEventListener("input", applyFilter);

  // ---- Button events ----
  playBtn.addEventListener("click", togglePlay);
  nextBtn.addEventListener("click", () => nextSong());
  prevBtn.addEventListener("click", () => prevSong());
  repeatBtn.addEventListener("click", cycleRepeat);
  orderBtn.addEventListener("click", cyclePlayOrder);
  downloadBtn.addEventListener("click", downloadCurrentSong);

  // ---- Theme (light/dark) ----
  function applyTheme(isDark) {
    document.documentElement.classList.toggle("dark", isDark);
    themeIconSun.classList.toggle("hidden", isDark);
    themeIconMoon.classList.toggle("hidden", !isDark);
    localStorage.setItem("theme", isDark ? "dark" : "light");
  }

  function initTheme() {
    // default to light mode regardless of system preference; only respect an explicit user choice
    const saved = localStorage.getItem("theme");
    applyTheme(saved === "dark");
  }

  themeToggleBtn.addEventListener("click", () => {
    applyTheme(!document.documentElement.classList.contains("dark"));
  });

  // ---- Init ----
  initTheme();
  initMediaSession();
  renderTabs();
  applyFilter();

  const firstSong = allSongs[0];
  loadSong(firstSong, false, filteredSongs);
</script>

</body>
</html>
